version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: huginn-mongodb
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: huginn-redis
    restart: unless-stopped
    networks:
      - app-network

  rest:
    build:
      context: ..
      dockerfile: docker/rest.Dockerfile
    container_name: huginn-rest
    ports:
      - "5000:5000"
    environment:
      # Environment Variables
      - NODE_ENV=${NODE_ENV:-development}
      
      # MongoDB Connection - using DATABASE_LOCAL
      #- DATABASE_LOCAL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=admin
      
      # Individual MongoDB variables (for your mongoose.js)
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DATABASE=${MONGO_DATABASE}
      
      # Add any other environment variables your app needs
      # - REDIS_URL=redis://redis:6379
      # - SESSION_SECRET=your_session_secret
    networks:
      - app-network
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    command: npm start

  socket:
    build:
      context: ..
      dockerfile: docker/socket.Dockerfile
    container_name: huginn-socket
    ports:
      - "5001:5001"
    environment:
      # Same environment variables as rest service
      - NODE_ENV=${NODE_ENV:-development}
      #- DATABASE_LOCAL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=admin
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DATABASE=${MONGO_DATABASE}
    networks:
      - app-network
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    command: npm run stream

  nginx:
    image: nginx:alpine
    container_name: huginn-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rest
      - socket
    networks:
      - app-network

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge